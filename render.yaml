services:
  - type: web
    name: manoshop-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
        - database/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: COMPANY_NAME
        value: Stilloak Studio
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEB_SERVICE_SECRET_KEY
        sync: false
      - key: STRIPE_WEB_SERVICE_WEBHOOK_SECRET
        sync: false
      - key: WEB_STRIPE_DEPOSITS_ENABLED
        value: "true"
      - key: WEB_SERVICE_STRIPE_LIVE_ENABLED
        value: "false"
      - key: WEB_SERVICE_ACTIVITY_CERTIFICATE_NUMBER
        sync: false
      - key: WEB_SERVICE_ACTIVITY_CODE
        sync: false
      - key: WEB_SERVICE_BUSINESS_ADDRESS
        sync: false
      - key: WEB_SERVICE_VAT_CODE
        sync: false
      - key: WEB_SERVICE_VAT_SCHEME
        value: svs_pending
      - key: WEB_SERVICE_OFFICIAL_DOCUMENTS_ENABLED
        value: "false"
      - key: DATABASE_BACKUP_ENABLED
        value: "false"
      - key: DATABASE_BACKUP_UPLOAD_URL
        sync: false
      - key: DATABASE_BACKUP_UPLOAD_TOKEN
        sync: false
      - key: DATABASE_BACKUP_ENCRYPTION_KEY
        sync: false
      - key: OPERATIONS_ALERT_EMAIL
        value: projects@stilloak-studio.com
      - key: WEB_BANK_TRANSFER_BENEFICIARY
        sync: false
      - key: WEB_BANK_TRANSFER_IBAN
        sync: false
      - key: WEB_BANK_TRANSFER_BIC
        sync: false
      - key: WEB_BANK_TRANSFER_BANK_NAME
        sync: false
      - key: STRIPE_PRICE_ASMENINIS
        sync: false
      - key: STRIPE_PRICE_PRIVATUS_VERSLAS
        sync: false
